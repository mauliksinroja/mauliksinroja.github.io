    <script>
      /* Loading screen: decided before first paint. First visit per session only, never with reduced motion. */
      (function () {
        try {
          var seen = sessionStorage.getItem('ms-loader-seen');
          var still =
            window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!seen && !still) {
            document.documentElement.classList.add('show-loader');
            window.__loaderStart = window.performance && performance.now ? performance.now() : 0;
            sessionStorage.setItem('ms-loader-seen', '1');
          }
        } catch (e) {
          /* storage blocked: skip the loader */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
